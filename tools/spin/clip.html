    const make = {
      glasses: it => { const G = new THREE.Group(), R = eyeR * (it.lens || 1.25), rim = std(it.color || 0x2a2440, { roughness: 0.3 });
        for (const e of eyeAt) { G.add(mesh(new THREE.TorusGeometry(R, R * 0.13, 14, 48), rim, e.x, e.y, 0));
          G.add(mesh(new THREE.CircleGeometry(R, 40), new THREE.MeshPhysicalMaterial({ color: 0xcfeaff, transparent: true, opacity: 0.2, roughness: 0.05, side: THREE.DoubleSide, depthWrite: false }), e.x, e.y, 0)); }
        arms(G, R, rim, 0); return G; },
      hearts: it => { const G = new THREE.Group(), R = eyeR * (it.lens || 1.3), rim = std(it.color || 0xff4f8b, { roughness: 0.25 }), dark = std(0x3a1026, { roughness: 0.08, metalness: 0.3 });
        for (const e of eyeAt) { const a = mesh(new THREE.ExtrudeGeometry(heartShape(R), { depth: R * 0.16, bevelEnabled: true, bevelSize: R * 0.06, bevelThickness: R * 0.06, bevelSegments: 3 }), rim, e.x, e.y + R * 0.12, -R * 0.1);
          const b = mesh(new THREE.ExtrudeGeometry(heartShape(R * 0.76), { depth: R * 0.06, bevelEnabled: true, bevelSize: R * 0.03, bevelThickness: R * 0.03, bevelSegments: 2 }), dark, e.x, e.y + R * 0.12, R * 0.12); G.add(a); G.add(b); }
        arms(G, R, rim, R * 0.2); return G; },
      halo: it => { const G = new THREE.Group(), R = H * (it.r || 0.13), gold = std(0xffd978, { emissive: 0xffb72e, emissiveIntensity: 0.9, roughness: 0.25, metalness: 0.4 });
        // (a soft glow round it was tried: a see-through gold over the dark screen comes out grey)
        G.add(mesh(new THREE.TorusGeometry(R, R * 0.13, 16, 64), gold)); G.rotation.x = -Math.PI / 2 + (it.tip == null ? 0.42 : it.tip); return G; },
    };
    for (const it of list) {
      let obj;
      if (it.type === "glb") {
        obj = (await load("/wear/" + it.file)).scene;
        const wb = new THREE.Box3().setFromObject(obj), ws = wb.getSize(new THREE.Vector3()), c = wb.getCenter(new THREE.Vector3()), k = (it.w || 0.4) * H / ws[it.by || "x"];
        obj.position.set(-c.x, it.base === "center" ? -c.y : it.base === "top" ? -wb.max.y : -wb.min.y, -c.z);
        const inner = new THREE.Group(); inner.add(obj); inner.scale.setScalar(k); if (it.squash) inner.scale.multiply(new THREE.Vector3(...it.squash)); obj = inner;
        obj.traverse(o => { if (o.isMesh) { o.frustumCulled = false; if (o.material) { o.material.envMapIntensity = 1; if (it.tint) o.material.color.multiply(new THREE.Color(it.tint)); } } });
      } else obj = make[it.type](it);
      const hold = new THREE.Group(), at = it.at || [0, 0, 0], rot = it.rot || [0, 0, 0];
      hold.add(obj); hold.position.copy(A[it.anchor || "top"]).add(new THREE.Vector3(at[0], at[1], at[2]).multiplyScalar(H));
      hold.rotation.set(rot[0] * Math.PI / 180, rot[1] * Math.PI / 180, rot[2] * Math.PI / 180, "YXZ");
      scene.add(hold); hold.updateMatrixWorld(true); (bones[it.bone] || (/neck|chest|back|collar/.test(it.anchor) ? chestB : head)).attach(hold);
      WORN.push({ key: it.key, hold });
    }
    if (action) action.play();
  }
  // layer=1: the creature goes into the depth only, so each thing worn comes out as what shows of it
  if (num("layer", 0)) bodyMeshes.forEach(o => (Array.isArray(o.material) ? o.material : [o.material]).forEach(mm => { mm.colorWrite = false; }));
  const tilt = num("tilt", 6) * Math.PI / 180, tan = Math.tan(camera.fov / 2 * Math.PI / 180);
  const place = (d, aim) => { camera.position.set(0, aim + Math.sin(tilt) * d, Math.cos(tilt) * d); camera.lookAt(0, aim, 0); camera.near = d / 50; camera.far = d * 4;
    if (PAD.top) {   // the creature's own frame is the bottom middle of a larger picture: the same camera, a wider window
      const fullH = Math.round(SIZE * (1 + 2 * PAD.top)); camera.aspect = OUT_W / fullH; camera.fov = 2 * Math.atan(tan * (1 + 2 * PAD.top)) * 180 / Math.PI; camera.setViewOffset(OUT_W, fullH, 0, 0, OUT_W, OUT_H); }
    camera.updateProjectionMatrix(); camera.updateMatrixWorld(true); };
  window.info = () => {
    // where the camera must stand for this motion to stay in the frame, and for its first moment alone
    const dur = clip ? clip.duration : 0, fill = num("fill", 0.9), fit = times => { let d = 3, aim = 0.5;
      for (let pass = 0; pass < 6; pass++) { place(d, aim); let x = 0, lo = 9, hi = -9;
        for (const t of times) { pose(t); for (const p of points()) { v.copy(p).project(camera); x = Math.max(x, Math.abs(v.x)); lo = Math.min(lo, v.y); hi = Math.max(hi, v.y); } }
        aim += (lo + hi) / 2 * d * tan; d *= Math.max(x, (hi - lo) / 2) / fill; }
      return { d, aim }; };
    const all = fit(Array.from({ length: 16 }, (_, i) => dur * i / 15)), rest = fit([0]);
    // how high its top and how low its foot go through the motion, moment by moment
    const tops = [], feet = []; for (let i = 0; i <= 30; i++) { pose(dur * i / 30); let hi = -9, lo = 9; for (const q of points()) { hi = Math.max(hi, q.y); lo = Math.min(lo, q.y); } tops.push(+hi.toFixed(2)); feet.push(+lo.toFixed(2)); }
    pose(0); const b = new THREE.Box3().setFromPoints(points());
    place(num("d", 3), num("aim", 0.5));   // back where the frames are drawn from: left at the measuring place, everything came out too near
    return { tops, feet, duration: dur, clips: g.animations.map(a => [a.name, +a.duration.toFixed(2)]), all, rest, height: b.max.y - b.min.y, floor: b.min.y, bones: Object.keys(bones) };
  };
  place(num("d", 3), num("aim", 0.5));
  window.frame = t => { pose(t); renderer.render(scene, camera); return renderer.domElement.toDataURL("image/png"); };
  // one picture for each thing worn, alone (with layer=1: only what the creature does not hide)
  window.layers = t => { pose(t); const out = {};
    for (const w of WORN) { WORN.forEach(x => { x.hold.visible = x === w; }); renderer.render(scene, camera); out[w.key] = renderer.domElement.toDataURL("image/png"); }
    WORN.forEach(x => { x.hold.visible = true; }); return out; };
  // the same moment from another side (degrees), for looking at how a thing sits
  // turn=DEG: the whole motion drawn from another side (a walk seen from three quarters, so that it walks along its
  // road and not across it). Set here, after everything was measured and hung on it facing the camera.
  const TURN = num("turn", num("yaw", 0)) * Math.PI / 180; pivot.rotation.y = TURN;
  // shift, raise: the whole of it moved sideways and up (world units), after everything was measured and hung on it:
  // a creature lying on its side is long, and lower than its feet were, and is set back in the middle of its frame
  pivot.position.x = num("shift", 0); pivot.position.y = num("raise", 0);
  window.frameYaw = (t, yaw) => { pivot.rotation.y = yaw * Math.PI / 180; const u = window.frame(t); pivot.rotation.y = TURN; return u; };
  window.ready = true;
})().catch(e => { window.failed = String(e && e.message || e); });
</script>
